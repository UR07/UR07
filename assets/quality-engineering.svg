<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">Umang Raj — Quality Engineer and SDET</title>
  <desc id="desc">Quality in every layer. A connected testing flow from UI to APIs, databases and logs.</desc>
